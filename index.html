<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sin scripts ni estilos en línea: si algún dato llegara a inyectar HTML, no podría ejecutar código
       (el token vive en sessionStorage, ver docs/IMPLEMENTACION-CORTE2.md, F1). connect-src queda abierto
       porque la URL de la API es configurable con ?api=. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http: https: ws: wss:; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <!-- Los enlaces de invitación y restablecimiento llevan un token en la URL: que no viaje en el Referer. -->
  <meta name="referrer" content="no-referrer" />
  <title>Fitodiagnóstico — Diagnóstico de plantas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27%3E%3Cpath d=%27M12 21V11%27 stroke=%27%233f8d4e%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M12 12c-4 0-7-3-7-7 4 0 7 3 7 7Z%27 fill=%27%235fae6c%27/%3E%3Cpath d=%27M12 15c0-4 3-7 7-7 0 4-3 7-7 7Z%27 fill=%27%233f8d4e%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/fuentes.css" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <a class="salto" href="#vista">Saltar al contenido</a>

  <header class="cabecera">
    <a class="marca" href="#/" aria-label="Fitodiagnóstico, ir al inicio">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path class="marca-tallo" d="M12 21V11" stroke-width="2" stroke-linecap="round" />
        <path class="marca-hoja-1" d="M12 12c-4 0-7-3-7-7 4 0 7 3 7 7Z" />
        <path class="marca-hoja-2" d="M12 15c0-4 3-7 7-7 0 4-3 7-7 7Z" />
      </svg>
      <h1>Fitodiagnóstico</h1>
    </a>
    <nav id="navegacion" class="navegacion" aria-label="Principal"></nav>
  </header>

  <main id="vista" class="contenido">
    <noscript><p class="banner-error">Esta aplicación necesita JavaScript.</p></noscript>
  </main>

  <footer class="pie">
    <p>Arquitectura de Software · U. Sergio Arboleda · 2026-2</p>
  </footer>

  <!-- GSAP 3.12.5 vendorizado (js/vendor/README.md): script clásico, define window.gsap antes del módulo. -->
  <script src="js/vendor/gsap.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
