<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sin scripts ni estilos en línea: si algún dato llegara a inyectar HTML, no podría ejecutar código
       (el token vive en sessionStorage, ver docs/IMPLEMENTACION-CORTE2.md, F1). connect-src queda abierto
       porque la URL de la API es configurable con ?api=. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http: https: ws: wss:; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <!-- Los enlaces de invitación y restablecimiento llevan un token en la URL: que no viaje en el Referer. -->
  <meta name="referrer" content="no-referrer" />
  <title>Fitodiagnóstico — Diagnóstico de plantas</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <a class="salto" href="#vista">Saltar al contenido</a>

  <header class="cabecera">
    <h1>Fitodiagnóstico</h1>
    <p class="subtitulo">Diagnóstico del estado de una planta a partir de humedad, luz y temperatura.</p>
    <nav id="navegacion" class="navegacion" aria-label="Principal"></nav>
  </header>

  <main id="vista" class="contenido">
    <noscript><p class="banner-error">Esta aplicación necesita JavaScript.</p></noscript>
  </main>

  <footer class="pie">
    <p>Arquitectura de Software · U. Sergio Arboleda · 2026-2</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
